<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kettle & Cloud — trend journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..640&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>/* Kettle & Cloud trend dashboard — the night journal.
   Palette: ink night #0A1024, panel #162241, star text #C7D0F2, lamplight #FFD98A, rain #7FD8C8. */

:root {
  --ink: #0A1024;
  --panel: #162241;
  --panel-soft: #121c38;
  --star: #C7D0F2;
  --star-dim: #8E9BC9;
  --glow: #FFD98A;
  --rain: #7FD8C8;
  --line: #2A3760;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--ink);
  color: var(--star);
  font: 16px/1.65 "Avenir Next", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.night { position: relative; min-height: 100vh; overflow: hidden; }

.inner { position: relative; max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
.inner.wide { max-width: 54rem; }

/* tabs + weeks nav */
.tabs { display: flex; gap: .2rem; margin-left: auto; }
.tabs button {
  background: none; border: 1px solid transparent; border-radius: 999px;
  color: var(--star-dim); font: inherit; font-size: .88rem; padding: .22rem .8rem; cursor: pointer;
}
.tabs button:hover { color: var(--star); }
.tabs button.on { border-color: var(--glow); color: var(--glow); background: rgba(255,217,138,.06); }
.tabs button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

/* ---- the galaxy ---- */
.galaxy-wrap { position: relative; margin-top: .5rem; }
.galaxy {
  display: block; width: 100%; cursor: grab; touch-action: none;
  background: radial-gradient(ellipse at 50% 42%, rgba(22,34,65,.55), rgba(10,16,36,0) 65%);
  border: 1px solid var(--panel-soft); border-radius: 14px;
}
.galaxy:active { cursor: grabbing; }
.galaxy:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.galaxy-hint {
  position: absolute; bottom: .7rem; left: 0; right: 0; text-align: center;
  color: var(--star-dim); font-size: .82rem; pointer-events: none; margin: 0;
}
.focus {
  margin-top: 1rem; border: 1px solid var(--panel-soft); border-radius: 12px;
  background: var(--panel-soft); padding: .9rem 1.1rem;
}
.focus h3 { margin: 0 0 .2rem; font-family: Fraunces, Georgia, serif; color: var(--glow); font-size: 1.2rem; }
.focus p { margin: 0; color: var(--star); }

/* ---- handles ---- */
table.sortable th.clickable { cursor: pointer; user-select: none; }
table.sortable th.clickable:hover { color: var(--star); }
table.sortable tbody tr { cursor: pointer; }
table.sortable tbody tr:hover td { background: rgba(22,34,65,.45); }
table.sortable tbody tr.sel td { background: rgba(255,217,138,.07); }
td.best { color: var(--glow); }
.note.tap { margin-top: .5rem; font-size: .82rem; }

/* ---- chat ---- */
.chat { display: flex; flex-direction: column; min-height: 26rem; }
.chat-setup {
  display: flex; flex-wrap: wrap; align-items: center; gap: .45rem;
  padding: .6rem .8rem; border: 1px solid var(--panel-soft); border-radius: 10px;
  background: var(--panel-soft); font-size: .85rem; color: var(--star-dim);
}
.chat-setup select, .chat-setup input {
  background: var(--ink); border: 1px solid var(--line); border-radius: 7px;
  color: var(--star); font: inherit; font-size: .85rem; padding: .28rem .55rem;
}
.chat-setup input { width: 13rem; }
.chat-setup input.model { width: 11rem; }
.chat-setup select:focus-visible, .chat-setup input:focus-visible { outline: 2px solid var(--glow); outline-offset: 1px; }
.chat-setup .setup-label { flex-basis: 100%; }

.chatlog {
  list-style: none; margin: 1rem 0; padding: .5rem 0; flex: 1;
  display: flex; flex-direction: column; gap: .6rem;
}
.chatlog li { max-width: 85%; padding: .6rem .9rem; border-radius: 12px; font-size: .93rem; line-height: 1.5; }
.chatlog li.you {
  align-self: flex-end; background: var(--panel); color: #F2F5FF;
  border-bottom-right-radius: 3px;
}
.chatlog li.ai {
  align-self: flex-start; background: var(--panel-soft); border: 1px solid var(--panel-soft);
  border-bottom-left-radius: 3px; color: var(--star);
}
.chatlog li.ai.intro { background: none; border: 0; color: var(--star-dim); font-style: italic; padding: .2rem 0; }
.chatlog li.typing { color: var(--star-dim); font-style: italic; }
.chatlog .aierr { display: block; color: #E89B8B; font-size: .8rem; margin-top: .3rem; }

.chatbar { display: flex; gap: .5rem; }
.chatbar input {
  flex: 1; background: var(--panel-soft); border: 1px solid var(--line); border-radius: 10px;
  color: #F2F5FF; font: inherit; padding: .6rem .85rem;
}
.chatbar input:focus-visible { outline: 2px solid var(--glow); outline-offset: 1px; }
.chatbar button {
  background: var(--glow); border: 0; border-radius: 10px; color: #1A1405;
  font: inherit; font-weight: 600; padding: .6rem 1.2rem; cursor: pointer;
}
.chatbar button:disabled { opacity: .45; cursor: default; }
.chatbar button:not(:disabled):hover { filter: brightness(1.06); }
.chatbar button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

/* drill-down drawer */
.drawer {
  margin-top: 1.2rem; border: 1px solid var(--line); border-radius: 14px;
  background: var(--panel-soft); padding: 1rem 1.2rem 1.2rem;
  animation: drawer-in .25s ease;
}
@keyframes drawer-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
.drawer header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
.drawer h3 { margin: 0; font-family: Fraunces, Georgia, serif; color: #F2F5FF; font-size: 1.15rem; }
.drawer h3 .dim { color: var(--star-dim); font-family: inherit; font-size: .85rem; font-weight: 400; }
.drawer .close {
  background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--star-dim);
  font-size: 1rem; line-height: 1; padding: .25rem .55rem; cursor: pointer;
}
.drawer .close:hover { color: var(--glow); border-color: var(--glow); }
.drawer .reels { list-style: none; margin: .9rem 0 0; padding: 0; }
.drawer .reels li { padding: .55rem 0; border-bottom: 1px solid rgba(42,55,96,.5); }
.drawer .reels li:last-child { border-bottom: 0; }
.barline { position: relative; height: 1.15rem; display: flex; align-items: center; }
.drawer .bar {
  height: 8px; border-radius: 4px; display: inline-block;
  background: linear-gradient(90deg, rgba(255,217,138,.25), var(--glow));
}
.drawer .val { margin-left: .6rem; color: var(--star); font-variant-numeric: tabular-nums; font-size: .88rem; }
.drawer .hook { margin: .2rem 0 0; color: #E4E9FB; font-size: .92rem; }
.drawer .meta { margin: .1rem 0 0; color: var(--star-dim); font-size: .82rem; }
.drawer .meta a { color: var(--rain); text-decoration: none; }
.drawer .meta a:hover { text-decoration: underline; }

/* the one orchestrated moment: a slow star drift on load */
.stars i {
  position: absolute;
  border-radius: 50%;
  background: #E7ECFF;
  opacity: .5;
  animation: drift 60s linear infinite alternate;
}
@keyframes drift { from { transform: translateY(0); } to { transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) { .stars i { animation: none; } }

/* masthead */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 2.5rem; position: relative; flex-wrap: wrap; }
.wordmark { font-family: Fraunces, Georgia, serif; font-size: 1.05rem; color: var(--glow); letter-spacing: .01em; }
.weeks { display: flex; gap: .25rem; flex-wrap: wrap; }
.weeks button {
  background: none; border: 1px solid transparent; border-radius: 6px;
  color: var(--star-dim); font: inherit; font-size: .85rem; padding: .15rem .55rem; cursor: pointer;
}
.weeks button:hover { color: var(--star); }
.weeks button.on { border-color: var(--line); color: var(--glow); background: var(--panel-soft); }
.weeks button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

/* cover line: the typeset hero */
.cover h1 {
  font-family: Fraunces, Georgia, serif;
  font-weight: 560;
  font-size: clamp(2rem, 5.4vw, 3.1rem);
  line-height: 1.14;
  color: #F2F5FF;
  margin: 0 0 1.1rem;
  text-wrap: balance;
}
.cover h1 em { font-style: normal; color: var(--glow); }
.cover .audio { font-size: 1.08rem; color: var(--star); margin: 0 0 .35rem; }
.cover .audio strong { color: #F2F5FF; font-weight: 600; }
.cover .movers { color: var(--star-dim); font-size: .95rem; margin: 0; }

/* sections */
section { margin-top: 3rem; }
section h2 {
  font-family: Fraunces, Georgia, serif;
  font-weight: 520;
  font-size: 1.35rem;
  color: #E4E9FB;
  margin: 0 0 .15rem;
}
.note { margin: 0 0 1rem; color: var(--star-dim); font-size: .92rem; }

/* tables: the only tool chrome */
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th { text-align: left; color: var(--star-dim); font-weight: 600; padding: .4rem .6rem .4rem 0; border-bottom: 1px solid var(--line); }
td { padding: .5rem .6rem .5rem 0; border-bottom: 1px solid var(--panel-soft); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.up { color: var(--rain); }
td.down { color: #E89B8B; }

/* outliers: breaks the column on purpose */
.outliers { list-style: none; margin: 0; padding: 0; }
.outliers li {
  display: grid; grid-template-columns: auto 1fr auto; gap: .1rem .9rem;
  padding: .9rem 0; border-bottom: 1px solid var(--panel-soft);
}
.who { color: var(--glow); font-weight: 600; }
.what { color: #E4E9FB; }
.go { grid-column: 3; grid-row: 1 / span 2; align-self: center; color: var(--rain); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: .3rem .7rem; font-size: .88rem; }
.go:hover { border-color: var(--rain); }
.go:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.stat { color: var(--star-dim); font-size: .88rem; font-variant-numeric: tabular-nums; }
.sound { color: var(--star-dim); font-size: .88rem; font-style: italic; }

/* seeds */
.seeds { padding-left: 1.3rem; }
.seeds li { margin: .45rem 0; padding-left: .3rem; }
.seeds li::marker { color: var(--glow); }

.empty { color: var(--star-dim); font-style: italic; }
.empty code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; color: var(--star); }

.base { margin-top: 4rem; color: var(--star-dim); font-size: .85rem; border-top: 1px solid var(--panel-soft); padding-top: 1rem; }

@media (max-width: 560px) {
  .outliers li { grid-template-columns: 1fr auto; }
  .go { grid-column: 2; grid-row: auto; }
  .sound { grid-column: 1 / -1; }
}
</style>
