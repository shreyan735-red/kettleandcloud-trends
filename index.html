<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kettle & Cloud Trends — weekly trend intelligence for the cozy-nostalgia niche on Instagram.">
<title>Kettle & Cloud Trends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..640;1,9..144,400..640&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>/* ============================================================
   Kettle & Cloud Trends — editorial trend-intelligence design
   Warm paper, charcoal ink, one ember accent. Fraunces + Inter.
   ============================================================ */

:root {
  /* surfaces */
  --paper: #FAF7F1;
  --paper-2: #F3EFE6;
  --card: #FFFDF9;
  --ink: #1D1A15;
  --ink-2: #4A443B;
  --ink-3: #857D6F;
  --hairline: #E6E0D3;
  --hairline-2: #D8D1C0;
  /* accent: ember — the one saturated voice */
  --ember: #C4501B;
  --ember-deep: #A03E12;
  --ember-wash: #FBEEE4;
  /* semantic */
  --up: #2E6B4F;
  --down: #B0402F;
  --flat: #857D6F;
  /* glass header */
  --glass: rgba(250, 247, 241, 0.82);
  /* type */
  --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --sans: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
  --shadow-1: 0 1px 2px rgba(29, 26, 21, .04), 0 2px 8px rgba(29, 26, 21, .04);
  --shadow-2: 0 2px 6px rgba(29, 26, 21, .06), 0 12px 32px rgba(29, 26, 21, .10);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15.5px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---------- header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--glass);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--hairline);
}
.header-inner {
  max-width: 72rem; margin: 0 auto; padding: 0 1.5rem;
  display: flex; align-items: center; gap: 1.25rem; height: 3.75rem;
}
.brand { display: flex; align-items: baseline; gap: .5rem; text-decoration: none; color: var(--ink); }
.brand-mark { color: var(--ember); font-size: 1.15rem; transform: translateY(1px); }
.brand-name { font-family: var(--serif); font-weight: 600; font-size: 1.12rem; letter-spacing: -0.01em; }
.brand-name em { font-style: italic; font-weight: 480; color: var(--ink-2); }
.brand-sub {
  font-family: var(--sans); font-size: .64rem; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ember); border: 1px solid var(--ember-wash);
  background: var(--ember-wash); border-radius: 4px; padding: .06rem .34rem; transform: translateY(-2px);
}
.main-nav { display: flex; gap: .25rem; margin-left: .75rem; }
.main-nav a {
  color: var(--ink-2); text-decoration: none; font-size: .92rem; font-weight: 500;
  padding: .42rem .72rem; border-radius: 7px; transition: color .15s, background .15s;
}
.main-nav a:hover { color: var(--ink); background: rgba(29, 26, 21, .05); }
.main-nav a.on { color: var(--ink); background: rgba(29, 26, 21, .07); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: .55rem; }
.icon-btn {
  display: inline-flex; align-items: center; gap: .45rem;
  background: none; border: 1px solid var(--hairline-2); border-radius: 8px;
  color: var(--ink-3); padding: .34rem .6rem; cursor: pointer; transition: border-color .15s, color .15s;
}
.icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.icon-btn kbd {
  font-family: var(--sans); font-size: .68rem; color: var(--ink-3);
  border: 1px solid var(--hairline-2); border-radius: 4px; padding: 0 .28rem;
}
.live-badge {
  display: inline-flex; align-items: center; gap: .35rem;
  font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--flat); border: 1px solid var(--hairline-2); border-radius: 999px; padding: .22rem .6rem;
}
.live-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--flat); }
.live-badge.is-live { color: var(--up); border-color: #CBDED3; }
.live-badge.is-live .dot { background: var(--up); animation: pulse 2.4s ease infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.burger { display: none; background: none; border: 0; cursor: pointer; padding: .4rem; }
.burger span { display: block; width: 18px; height: 2px; background: var(--ink); margin: 4px 0; border-radius: 2px; transition: transform .2s, opacity .2s; }
.burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

/* ---------- hero ---------- */
.hero {
  position: relative; overflow: hidden;
  border-bottom: 1px solid var(--hairline);
  background:
    radial-gradient(58rem 30rem at 85% -10%, var(--ember-wash), transparent 60%),
    linear-gradient(var(--paper), var(--paper));
}
.hero-visual { position: absolute; inset: 0; opacity: .5; pointer-events: none; }
.hero-visual .galaxy { border: 0; background: transparent; }
.hero-copy { position: relative; max-width: 72rem; margin: 0 auto; padding: 5.5rem 1.5rem 4.5rem; }
.hero h1 {
  font-family: var(--serif); font-weight: 560; letter-spacing: -0.022em;
  font-size: clamp(2.3rem, 5.4vw, 3.9rem); line-height: 1.06;
  max-width: 21ch; margin: 0 0 1.1rem; animation: rise .6s ease both;
}
.hero h1 em { font-style: italic; color: var(--ember); }
.lede { font-size: 1.13rem; color: var(--ink-2); max-width: 52ch; margin: 0 0 1.8rem; animation: rise .6s .08s ease both; }
.hero-ctas { display: flex; gap: .7rem; flex-wrap: wrap; animation: rise .6s .16s ease both; }
.hero-meta { color: var(--ink-3); font-size: .88rem; margin-top: 1.6rem; animation: rise .6s .24s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.btn {
  font: 600 .95rem/1 var(--sans); border-radius: 9px; cursor: pointer;
  padding: .78rem 1.35rem; border: 1px solid transparent; transition: transform .15s, box-shadow .15s, border-color .15s, background .15s;
}
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); background: #000; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--hairline-2); }
.btn-ghost:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.btn:focus-visible, .icon-btn:focus-visible, .burger:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

/* ---------- layout ---------- */
main { min-height: 60vh; }
.section { max-width: 72rem; margin: 0 auto; padding: 3.75rem 1.5rem 1rem; }
.eyebrow {
  font-size: .72rem; font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ember); margin: 0 0 .55rem;
}
.section h2 {
  font-family: var(--serif); font-weight: 560; letter-spacing: -0.015em;
  font-size: clamp(1.55rem, 3vw, 2.1rem); margin: 0 0 .4rem;
}
.note { color: var(--ink-3); font-size: .95rem; margin: 0 0 1.75rem; max-width: 62ch; }
.note.small { margin: .5rem 0 0; font-size: .85rem; }
.sub { font-family: var(--serif); font-size: 1.12rem; font-weight: 560; margin: 1.9rem 0 .7rem; }

/* ---------- badges & deltas ---------- */
.badge {
  display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .06em;
  border-radius: 5px; padding: .18rem .5rem; white-space: nowrap;
}
.badge-cat { background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--hairline); }
.badge-ember { background: var(--ember-wash); color: var(--ember-deep); }
.delta { display: inline-flex; align-items: center; gap: .28rem; font-size: .84rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.delta-up { color: var(--up); }
.delta-down { color: var(--down); }
.delta-flat { color: var(--flat); font-weight: 500; }

/* ---------- filters ---------- */
.filters { display: flex; flex-direction: column; gap: .8rem; margin-bottom: 1.9rem; }
.search-field {
  position: relative; max-width: 26rem;
}
.search-field svg { position: absolute; left: .8rem; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search-field input {
  width: 100%; padding: .62rem 1rem .62rem 2.3rem;
  border: 1px solid var(--hairline-2); border-radius: 9px; background: var(--card);
  font: 400 .93rem var(--sans); color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
.search-field input:focus { outline: none; border-color: var(--ember); box-shadow: 0 0 0 3px var(--ember-wash); }
.sorts, .cats { display: flex; gap: .3rem; flex-wrap: wrap; }
.sorts button, .cats button {
  background: none; border: 1px solid transparent; border-radius: 999px;
  color: var(--ink-2); font: 500 .86rem var(--sans); padding: .34rem .78rem; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
}
.sorts button { border-color: var(--hairline-2); }
.sorts button:hover, .cats button:hover { color: var(--ink); border-color: var(--ink-3); }
.sorts button.on, .cats button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---------- trend cards ---------- */
.trend-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr));
  gap: 1.1rem;
}
.trend-card {
  background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  opacity: 0; animation: card-in .5s ease both; animation-delay: var(--stagger, 0ms);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
@keyframes card-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.trend-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: var(--hairline-2); }
.card-hit {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  padding: 1.15rem 1.2rem 1rem; cursor: pointer; color: inherit; font: inherit; border-radius: var(--radius);
}
.card-hit:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-bottom: .45rem; }
.card-top h3 { font-family: var(--serif); font-size: 1.18rem; font-weight: 580; margin: 0; letter-spacing: -0.01em; }
.card-desc { color: var(--ink-2); font-size: .9rem; margin: 0 0 1rem; min-height: 2.6em; }
.card-mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; padding-bottom: .8rem; border-bottom: 1px solid var(--hairline); }
.metric-num { font-family: var(--serif); font-size: 1.65rem; font-weight: 580; letter-spacing: -0.02em; display: block; line-height: 1.1; }
.metric-label { color: var(--ink-3); font-size: .78rem; }
.spark { color: var(--ember); flex-shrink: 0; }
.spark-line { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1s .2s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.card-foot { display: flex; align-items: center; gap: .8rem; padding-top: .7rem; }
.src { color: var(--ink-3); font-size: .78rem; margin-right: auto; }
.score {
  font-variant-numeric: tabular-nums; font-weight: 600; font-size: .84rem; color: var(--ink-2);
  border: 1px solid var(--hairline-2); border-radius: 6px; padding: .14rem .45rem;
}

/* ---------- detail page ---------- */
.detail-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
  gap: 1px; background: var(--hairline); border: 1px solid var(--hairline);
  border-radius: var(--radius); overflow: hidden; margin: 0 0 2.25rem;
}
.stat-block { background: var(--card); padding: 1.1rem 1.2rem; }
.stat-num { font-family: var(--serif); font-size: 1.9rem; font-weight: 580; letter-spacing: -0.02em; display: block; }
.stat-label { color: var(--ink-3); font-size: .8rem; }
.detail-chart { margin-bottom: 1rem; }
.chart-wrap { position: relative; max-width: 46rem; }
.linechart { width: 100%; height: auto; display: block; }
.grid { stroke: var(--hairline); stroke-width: 1; }
.axis { fill: var(--ink-3); font-size: 11px; font-family: var(--sans); }
.chart-line { stroke: var(--ember); }
.chart-area { fill: var(--ember-wash); opacity: .7; }
.chart-dot { fill: var(--card); stroke: var(--ember); stroke-width: 1.8; transition: r .12s; }
.chart-cursor { stroke: var(--hairline-2); stroke-width: 1; stroke-dasharray: 3 3; }
.chart-tip {
  position: absolute; transform: translate(-50%, -120%);
  background: var(--ink); color: var(--paper); font-size: .8rem;
  border-radius: 7px; padding: .35rem .6rem; pointer-events: none; white-space: nowrap;
  box-shadow: var(--shadow-2);
}
.detail-cols { display: grid; grid-template-columns: 1.25fr 1fr; gap: 3rem; max-width: 62rem; }
.why { color: var(--ink-2); font-size: .98rem; margin: 0; }
.obs { margin: 0; padding-left: 1.15rem; color: var(--ink-2); font-size: .94rem; }
.obs li { margin: .4rem 0; }
.obs strong { color: var(--ink); font-weight: 600; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: flex; align-items: baseline; gap: .9rem; padding: .5rem 0; border-bottom: 1px solid var(--hairline); }
.tl-day { color: var(--ink-3); font-size: .84rem; min-width: 5.2rem; }
.tl-val { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: auto; }
.related { display: flex; flex-wrap: wrap; gap: .5rem; }
.related-chip {
  display: inline-flex; align-items: center; gap: .5rem;
  background: var(--card); border: 1px solid var(--hairline-2); border-radius: 999px;
  padding: .42rem .85rem; font: 500 .88rem var(--sans); color: var(--ink); cursor: pointer;
  transition: border-color .15s, transform .15s;
}
.related-chip:hover { border-color: var(--ember); transform: translateY(-1px); }

/* ---------- creators / tables ---------- */
table.sortable { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
table.sortable thead th {
  text-align: left; font-size: .78rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3); padding: .7rem .9rem; border-bottom: 1px solid var(--hairline); background: var(--paper-2);
}
table.sortable td { padding: .68rem .9rem; border-bottom: 1px solid var(--hairline); font-size: .93rem; }
table.sortable tbody tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; font-variant-numeric: tabular-nums; }
th.clickable { cursor: pointer; user-select: none; }
th.clickable:hover { color: var(--ink); }
table.sortable tbody tr { cursor: pointer; transition: background .12s; }
table.sortable tbody tr:hover td { background: var(--paper-2); }
table.sortable tbody tr.sel td { background: var(--ember-wash); }
td.who { color: var(--ember-deep); font-weight: 600; }
td.best { font-weight: 600; }
.note.tap { margin-top: .55rem; font-size: .82rem; }

.drawer {
  margin-top: 1.3rem; background: var(--card); border: 1px solid var(--hairline);
  border-radius: var(--radius); box-shadow: var(--shadow-1);
  padding: 1.1rem 1.3rem; animation: card-in .3s ease;
}
.drawer header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
.drawer h3 { font-family: var(--serif); font-size: 1.15rem; margin: 0; }
.drawer .dim { color: var(--ink-3); font-family: var(--sans); font-size: .84rem; font-weight: 400; }
.drawer .close { background: none; border: 1px solid var(--hairline-2); border-radius: 7px; color: var(--ink-3); font-size: 1rem; line-height: 1; padding: .25rem .55rem; cursor: pointer; }
.drawer .close:hover { color: var(--ink); border-color: var(--ink-3); }
.bars { list-style: none; margin: .9rem 0 0; padding: 0; }
.bars li { padding: .55rem 0; border-bottom: 1px solid var(--hairline); }
.bars li:last-child { border-bottom: 0; }
.barline { display: flex; align-items: center; height: 1.15rem; }
.bars .bar, .drawer .bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--ember-wash), var(--ember)); display: inline-block; }
.bars .val, .drawer .val { margin-left: .6rem; color: var(--ink-2); font-size: .84rem; font-variant-numeric: tabular-nums; }
.bars .hook, .drawer .hook { margin: .22rem 0 0; color: var(--ink-2); font-size: .9rem; }
.bars .meta, .drawer .meta { margin: .08rem 0 0; font-size: .8rem; }
.bars .meta a, .drawer .meta a { color: var(--ember-deep); text-decoration: none; }
.bars .meta a:hover, .drawer .meta a:hover { text-decoration: underline; }

/* ---------- insights ---------- */
.insight-lede { margin-bottom: 1rem; }
.verdict { font-family: var(--serif); font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 560; letter-spacing: -0.015em; margin: 0 0 .5rem; }
.verdict em { color: var(--ember); font-style: italic; }
.insight-cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 3rem; }
.outliers { list-style: none; margin: 0; padding: 0; }
.outliers li { display: grid; grid-template-columns: auto 1fr auto; gap: .1rem .9rem; padding: .8rem 0; border-bottom: 1px solid var(--hairline); }
.outliers .who { color: var(--ember-deep); font-weight: 600; }
.outliers .what { color: var(--ink-2); font-size: .92rem; }
.outliers .go { grid-column: 3; grid-row: 1 / span 2; align-self: center; color: var(--ember-deep); text-decoration: none; border: 1px solid var(--hairline-2); border-radius: 7px; padding: .28rem .65rem; font-size: .84rem; transition: border-color .15s; }
.outliers .go:hover { border-color: var(--ember); }
.outliers .stat { grid-column: 1 / -1; color: var(--ink-3); font-size: .82rem; font-variant-numeric: tabular-nums; }
.seeds { padding-left: 1.25rem; color: var(--ink-2); }
.seeds li { margin: .45rem 0; }
.seeds li::marker { color: var(--ember); font-weight: 600; }

/* ---------- about ---------- */
.about-cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 3rem; max-width: 62rem; }
.about-cols p { color: var(--ink-2); font-size: .98rem; margin: 0 0 1rem; max-width: 58ch; }

/* ---------- galaxy (dark vignette card, works inside cream) ---------- */
.galaxy-wrap { position: relative; }
.galaxy-wrap.compact { position: absolute; inset: 0; }
.galaxy {
  display: block; width: 100%; cursor: grab; touch-action: none;
  background: radial-gradient(ellipse at 50% 42%, rgba(29, 26, 21, .88), rgba(29, 26, 21, .72) 70%);
  border: 0; border-radius: var(--radius);
}
.galaxy-wrap:not(.compact) .galaxy { border: 1px solid var(--hairline); }
.galaxy:active { cursor: grabbing; }
.galaxy:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.galaxy-hint { position: absolute; bottom: .7rem; left: 0; right: 0; text-align: center; color: rgba(250, 247, 241, .55); font-size: .8rem; pointer-events: none; margin: 0; }
.focus { margin-top: 1rem; background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius); padding: .9rem 1.1rem; }
.focus h3 { margin: 0 0 .2rem; font-family: var(--serif); color: var(--ember-deep); font-size: 1.2rem; }
.focus p { margin: 0; color: var(--ink-2); }

/* ---------- chat ---------- */
.chat { display: flex; flex-direction: column; min-height: 26rem; }
.chat-setup {
  display: flex; flex-wrap: wrap; align-items: center; gap: .45rem;
  padding: .65rem .85rem; border: 1px solid var(--hairline); border-radius: var(--radius);
  background: var(--card); font-size: .84rem; color: var(--ink-3);
}
.chat-setup select, .chat-setup input {
  background: var(--paper); border: 1px solid var(--hairline-2); border-radius: 7px;
  color: var(--ink); font: 400 .85rem var(--sans); padding: .32rem .55rem;
}
.chat-setup input { width: 13rem; }
.chat-setup input.model { width: 11rem; }
.chat-setup select:focus-visible, .chat-setup input:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }
.chat-setup .setup-label { flex-basis: 100%; }
.chatlog { list-style: none; margin: 1rem 0; padding: .5rem 0; flex: 1; display: flex; flex-direction: column; gap: .6rem; }
.chatlog li { max-width: 85%; padding: .6rem .9rem; border-radius: 12px; font-size: .92rem; line-height: 1.55; }
.chatlog li.you { align-self: flex-end; background: var(--ink); color: var(--paper); border-bottom-right-radius: 3px; }
.chatlog li.ai { align-self: flex-start; background: var(--paper-2); border: 1px solid var(--hairline); border-bottom-left-radius: 3px; color: var(--ink); }
.chatlog li.ai.intro { background: none; border: 0; color: var(--ink-3); font-style: italic; padding: .2rem 0; }
.chatlog li.typing { color: var(--ink-3); font-style: italic; }
.chatlog .aierr { display: block; color: var(--down); font-size: .8rem; margin-top: .3rem; }
.chatbar { display: flex; gap: .5rem; }
.chatbar input {
  flex: 1; background: var(--card); border: 1px solid var(--hairline-2); border-radius: 9px;
  color: var(--ink); font: 400 .93rem var(--sans); padding: .62rem .85rem; transition: border-color .15s, box-shadow .15s;
}
.chatbar input:focus { outline: none; border-color: var(--ember); box-shadow: 0 0 0 3px var(--ember-wash); }
.chatbar button {
  background: var(--ember); border: 0; border-radius: 9px; color: #FFF6EF;
  font: 600 .93rem var(--sans); padding: .62rem 1.2rem; cursor: pointer; transition: background .15s, transform .15s;
}
.chatbar button:disabled { opacity: .45; cursor: default; }
.chatbar button:not(:disabled):hover { background: var(--ember-deep); transform: translateY(-1px); }
.chatbar button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

/* ---------- search palette ---------- */
.palette-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(29, 26, 21, .32);
  backdrop-filter: blur(3px); display: flex; justify-content: center; padding: 11vh 1rem 0;
  animation: fade-in .15s ease;
}
@keyframes fade-in { from { opacity: 0; } }
.palette {
  width: 100%; max-width: 34rem; height: fit-content; background: var(--card);
  border-radius: 12px; box-shadow: 0 24px 64px rgba(29, 26, 21, .25);
  overflow: hidden; animation: palette-in .18s ease;
}
@keyframes palette-in { from { opacity: 0; transform: translateY(-8px) scale(.99); } }
.palette-bar { display: flex; align-items: center; gap: .6rem; padding: .85rem 1rem; border-bottom: 1px solid var(--hairline); color: var(--ink-3); }
.palette-bar input { flex: 1; border: 0; background: none; font: 400 1rem var(--sans); color: var(--ink); }
.palette-bar input:focus { outline: none; }
.palette-bar kbd { font-size: .68rem; color: var(--ink-3); border: 1px solid var(--hairline-2); border-radius: 4px; padding: .05rem .3rem; }
.palette-results { list-style: none; margin: 0; padding: .4rem; max-height: 20rem; overflow: auto; }
.palette-results button {
  display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: 1rem;
  background: none; border: 0; border-radius: 8px; text-align: left;
  padding: .6rem .75rem; font: 400 .93rem var(--sans); color: var(--ink); cursor: pointer;
}
.palette-results button span { color: var(--ink-3); font-size: .8rem; }
.palette-results button.on, .palette-results button:hover { background: var(--ember-wash); }
.palette-results button.on strong { color: var(--ember-deep); }
.palette-empty { color: var(--ink-3); padding: .8rem; font-size: .9rem; }

/* ---------- empty states ---------- */
.empty-state {
  text-align: center; padding: 4rem 1rem; color: var(--ink-2);
  border: 1px dashed var(--hairline-2); border-radius: var(--radius); background: var(--card);
  max-width: 34rem; margin: 2rem auto;
}
.empty-icon { font-size: 1.9rem; color: var(--ember); display: block; margin-bottom: .6rem; }
.empty-state h3 { font-family: var(--serif); margin: 0 0 .3rem; font-weight: 560; }
.empty-state p { margin: 0 auto; color: var(--ink-3); font-size: .92rem; max-width: 40ch; }
.empty { color: var(--ink-3); font-style: italic; }

/* ---------- footer ---------- */
.site-footer { border-top: 1px solid var(--hairline); margin-top: 4rem; background: var(--paper-2); }
.footer-inner {
  max-width: 72rem; margin: 0 auto; padding: 1.6rem 1.5rem;
  display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
}
.brand-name.small { font-size: .98rem; }
.site-footer nav { display: flex; gap: 1.1rem; margin-left: auto; }
.site-footer nav a { color: var(--ink-2); text-decoration: none; font-size: .88rem; }
.site-footer nav a:hover { color: var(--ember-deep); }
.fineprint { color: var(--ink-3); font-size: .8rem; flex-basis: 100%; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .detail-cols, .insight-cols, .about-cols { grid-template-columns: 1fr; gap: 1.5rem; }
  .hero-copy { padding: 4rem 1.5rem 3.5rem; }
}
@media (max-width: 760px) {
  .main-nav {
    display: none; position: absolute; top: 3.75rem; left: 0; right: 0;
    background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--hairline); flex-direction: column; padding: .6rem 1rem 1rem; gap: .15rem;
  }
  .main-nav.open { display: flex; }
  .main-nav a { padding: .65rem .75rem; font-size: 1rem; }
  .nav-cta { margin-top: .5rem; }
  .burger { display: block; }
  .icon-btn kbd { display: none; }
  .cats, .sorts { overflow-x: auto; flex-wrap: nowrap; padding-bottom: .3rem; scrollbar-width: none; }
  .cats::-webkit-scrollbar, .sorts::-webkit-scrollbar { display: none; }
  .cats button, .sorts button { white-space: nowrap; flex-shrink: 0; }
  .trend-grid { grid-template-columns: 1fr; }
  .section { padding: 2.75rem 1.1rem .75rem; }
  .hero-copy { padding: 3.2rem 1.1rem 3rem; }
  .outliers li { grid-template-columns: 1fr auto; }
  .outliers .go { grid-column: 2; grid-row: auto; }
}
.nav-cta {
  margin-left: .5rem; background: var(--ink); color: var(--paper);
  border: 0; border-radius: 8px; font: 600 .88rem var(--sans);
  padding: .5rem .95rem; cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.nav-cta:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
</style>
