<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kettle & Cloud Trends — weekly trend intelligence for the cozy-nostalgia niche on Instagram.">
<title>Kettle & Cloud Trends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..640;1,9..144,400..640&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>/* ============================================================
   Kettle & Cloud Trends — editorial trend-intelligence design
   Warm paper, charcoal ink, one ember accent. Fraunces + Inter.
   ============================================================ */

:root {
  /* surfaces */
  --paper: #FAF7F1;
  --paper-2: #F3EFE6;
  --card: #FFFDF9;
  --ink: #1D1A15;
  --ink-2: #4A443B;
  --ink-3: #857D6F;
  --hairline: #E6E0D3;
  --hairline-2: #D8D1C0;
  /* accent: ember — the one saturated voice */
  --ember: #C4501B;
  --ember-deep: #A03E12;
  --ember-wash: #FBEEE4;
  /* semantic */
  --up: #2E6B4F;
  --down: #B0402F;
  --flat: #857D6F;
  /* glass header */
  --glass: rgba(250, 247, 241, 0.82);
  /* type */
  --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --sans: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
  --shadow-1: 0 1px 2px rgba(29, 26, 21, .04), 0 2px 8px rgba(29, 26, 21, .04);
  --shadow-2: 0 2px 6px rgba(29, 26, 21, .06), 0 12px 32px rgba(29, 26, 21, .10);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15.5px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---------- header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--glass);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--hairline);
}
.header-inner {
  max-width: 72rem; margin: 0 auto; padding: 0 1.5rem;
  display: flex; align-items: center; gap: 1.25rem; height: 3.75rem;
}
.brand { display: flex; align-items: baseline; gap: .5rem; text-decoration: none; color: var(--ink); }
.brand-mark { color: var(--ember); font-size: 1.15rem; transform: translateY(1px); }
.brand-name { font-family: var(--serif); font-weight: 600; font-size: 1.12rem; letter-spacing: -0.01em; }
.brand-name em { font-style: italic; font-weight: 480; color: var(--ink-2); }
.brand-sub {
  font-family: var(--sans); font-size: .64rem; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ember); border: 1px solid var(--ember-wash);
  background: var(--ember-wash); border-radius: 4px; padding: .06rem .34rem; transform: translateY(-2px);
}
.main-nav { display: flex; gap: .25rem; margin-left: .75rem; }
.main-nav a {
  color: var(--ink-2); text-decoration: none; font-size: .92rem; font-weight: 500;
  padding: .42rem .72rem; border-radius: 7px; transition: color .15s, background .15s;
}
.main-nav a:hover { color: var(--ink); background: rgba(29, 26, 21, .05); }
.main-nav a.on { color: var(--ink); background: rgba(29, 26, 21, .07); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: .55rem; }
.icon-btn {
  display: inline-flex; align-items: center; gap: .45rem;
  background: none; border: 1px solid var(--hairline-2); border-radius: 8px;
  color: var(--ink-3); padding: .34rem .6rem; cursor: pointer; transition: border-color .15s, color .15s;
}
.icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.icon-btn kbd {
  font-family: var(--sans); font-size: .68rem; color: var(--ink-3);
  border: 1px solid var(--hairline-2); border-radius: 4px; padding: 0 .28rem;
}
.live-badge {
  display: inline-flex; align-items: center; gap: .35rem;
  font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--flat); border: 1px solid var(--hairline-2); border-radius: 999px; padding: .22rem .6rem;
}
.live-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--flat); }
.live-badge.is-live { color: var(--up); border-color: #CBDED3; }
.live-badge.is-live .dot { background: var(--up); animation: pulse 2.4s ease infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.burger { display: none; background: none; border: 0; cursor: pointer; padding: .4rem; }
.burger span { display: block; width: 18px; height: 2px; background: var(--ink); margin: 4px 0; border-radius: 2px; transition: transform .2s, opacity .2s; }
.burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

/* ---------- hero ---------- */
.hero {
  position: relative; overflow: hidden;
  border-bottom: 1px solid var(--hairline);
  background:
    radial-gradient(58rem 30rem at 85% -10%, var(--ember-wash), transparent 60%),
    linear-gradient(var(--paper), var(--paper));
}
.hero-visual { position: absolute; inset: 0; opacity: .5; pointer-events: none; }
.hero-visual .galaxy { border: 0; background: transparent; }
.hero-copy { position: relative; max-width: 72rem; margin: 0 auto; padding: 5.5rem 1.5rem 4.5rem; }
.hero h1 {
  font-family: var(--serif); font-weight: 560; letter-spacing: -0.022em;
  font-size: clamp(2.3rem, 5.4vw, 3.9rem); line-height: 1.06;
  max-width: 21ch; margin: 0 0 1.1rem; animation: rise .6s ease both;
}
.hero h1 em { font-style: italic; color: var(--ember); }
.lede { font-size: 1.13rem; color: var(--ink-2); max-width: 52ch; margin: 0 0 1.8rem; animation: rise .6s .08s ease both; }
.hero-ctas { display: flex; gap: .7rem; flex-wrap: wrap; animation: rise .6s .16s ease both; }
.hero-meta { color: var(--ink-3); font-size: .88rem; margin-top: 1.6rem; animation: rise .6s .24s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.btn {
  font: 600 .95rem/1 var(--sans); border-radius: 9px; cursor: pointer;
  padding: .78rem 1.35rem; border: 1px solid transparent; transition: transform .15s, box-shadow .15s, border-color .15s, background .15s;
}
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); background: #000; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--hairline-2); }
.btn-ghost:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.btn:focus-visible, .icon-btn:focus-visible, .burger:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.btn-small { padding: .5rem .95rem; font-size: .88rem; }

/* ============================================================
   Kettle Assistant — floating robot, chat panel, chats page
   (built on the same paper/ink/ember tokens; no new palette)
   ============================================================ */
:root {
  --dock-b: 24px; --dock-r: 24px;
  --panel-w: 400px; --panel-h: 600px;
}

/* ---------- the robot ---------- */
.assistant-fab {
  position: fixed; right: var(--dock-r); bottom: var(--dock-b); z-index: 120;
  width: 60px; height: 60px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--ink); color: var(--paper);
  border: 1px solid rgba(255, 253, 249, .14);
  box-shadow: 0 4px 16px rgba(29, 26, 21, .28), 0 2px 6px rgba(29, 26, 21, .2);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
  animation: bot-in .4s .4s ease both;
}
@keyframes bot-in { from { opacity: 0; transform: translateY(8px); } }
.assistant-fab::before {
  /* breathing halo — the “premium glow” */
  content: ''; position: absolute; inset: -7px; border-radius: 50%;
  border: 1px solid rgba(196, 80, 27, .0);
  animation: bot-glow 3.2s ease-in-out infinite;
}
@keyframes bot-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(196, 80, 27, 0); }
  50% { box-shadow: 0 0 14px 2px rgba(196, 80, 27, .18); }
}
.assistant-fab svg { animation: bot-float 3.2s ease-in-out infinite; }
@keyframes bot-float { 50% { transform: translateY(-2px); } }
.fab-status {
  position: absolute; right: 2px; bottom: 2px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--up); border: 2px solid var(--paper);
}
.assistant-fab:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(29, 26, 21, .32); }
.assistant-fab:active { transform: translateY(-1px); }
.assistant-fab:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

/* ---------- panel ---------- */
.assistant-dock { position: static; }
.assistant-panel {
  position: fixed; right: calc(var(--dock-r) + 58px); bottom: calc(var(--dock-b) + 4px);
  z-index: 119; width: var(--panel-w); height: var(--panel-h); max-height: calc(100dvh - var(--dock-b) - 80px);
  background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 12px 40px rgba(29, 26, 1, .22);
  display: flex; flex-direction: column; overflow: hidden;
  opacity: 0; transform: translateY(10px) scale(.98); pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.assistant-panel.open { opacity: 1; transform: none; pointer-events: auto; }
@media (prefers-reduced-motion: reduce) { .assistant-panel { transition: none; } }

.assistant-head {
  display: flex; align-items: center; gap: .7rem; padding: .8rem 1rem;
  background: var(--ink); color: var(--paper); flex-shrink: 0;
}
.head-avatar { display: flex; color: var(--ember-wash); }
.head-id { display: flex; flex-direction: column; line-height: 1.25; }
.head-id strong { font-family: var(--serif); font-size: .98rem; font-weight: 560; }
.head-status { display: flex; align-items: center; gap: .35rem; font-size: .72rem; color: rgba(250, 247, 241, .72); }
.head-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #6FBF8F; }
.head-btn {
  background: none; border: 0; color: rgba(250, 247, 241, .75); cursor: pointer;
  border-radius: 7px; padding: .3rem; display: flex; margin-left: .1rem;
  transition: background .15s, color .15s;
}
.head-btn:hover { background: rgba(250, 247, 241, .12); color: var(--paper); }
.head-btn:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }
.assistant-head .head-btn:first-of-type { margin-left: auto; }

/* ---------- conversation (shared) ---------- */
.convo { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.welcome { padding: 1.4rem 1.2rem .4rem; }
.welcome .wave { font-family: var(--serif); font-size: 1.3rem; font-weight: 560; margin: 0 0 .35rem; }
.welcome-sub { color: var(--ink-2); font-size: .92rem; margin: 0 0 1rem; }
.sugs { display: flex; flex-wrap: wrap; gap: .45rem; }
.sug {
  background: var(--card); border: 1px solid var(--hairline-2); border-radius: 999px;
  color: var(--ink-2); font: 500 .82rem var(--sans); padding: .38rem .8rem; cursor: pointer;
  transition: border-color .15s, color .15s, transform .15s;
}
.sug:hover { border-color: var(--ember); color: var(--ember-deep); transform: translateY(-1px); }
.sug:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.clog {
  list-style: none; margin: 0; padding: 1rem 1rem .4rem; flex: 1; min-height: 0;
  display: flex; flex-direction: column; gap: .65rem; overflow-y: auto;
}
.msg { max-width: 86%; padding: .6rem .85rem; border-radius: 12px; font-size: .9rem; line-height: 1.55; animation: msg-in .22s ease both; }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } }
.msg.user { align-self: flex-end; background: var(--ink); color: var(--paper); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--paper-2); border: 1px solid var(--hairline); border-bottom-left-radius: 4px; }
.msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .stamp { display: block; margin-top: .3rem; font-size: .68rem; opacity: .55; }
.msg.typing { display: flex; gap: 4px; padding: .75rem .85rem; }
.tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: tdot 1.1s ease infinite; }
.tdot:nth-child(2) { animation-delay: .18s; }
.tdot:nth-child(3) { animation-delay: .36s; }
@keyframes tdot { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
.convo-cfg {
  display: flex; flex-wrap: wrap; gap: .4rem; padding: .5rem 1rem 0;
  border-top: 1px solid var(--hairline); font-size: .8rem;
}
.convo-cfg select, .convo-cfg input {
  background: var(--paper); border: 1px solid var(--hairline-2); border-radius: 7px;
  color: var(--ink); font: 400 .8rem var(--sans); padding: .28rem .5rem;
}
.convo-cfg input { width: 11rem; }
.convo-cfg input.model { width: 9rem; }
.convo-cfg select:focus-visible, .convo-cfg input:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }
.convo-bar { display: flex; gap: .5rem; padding: .7rem 1rem .9rem; flex-shrink: 0; }
.convo-bar textarea {
  flex: 1; resize: none; min-height: 2.5rem; max-height: 7rem;
  background: var(--paper); border: 1px solid var(--hairline-2); border-radius: 10px;
  color: var(--ink); font: 400 .9rem/1.45 var(--sans); padding: .6rem .75rem;
  transition: border-color .15s, box-shadow .15s;
}
.convo-bar textarea:focus { outline: none; border-color: var(--ember); box-shadow: 0 0 0 3px var(--ember-wash); }
.convo-bar textarea::placeholder { color: var(--ink-3); }
.convo-bar button {
  align-self: flex-end; width: 40px; height: 40px; flex-shrink: 0;
  background: var(--ember); border: 0; border-radius: 10px; color: #FFF6EF;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: background .15s, transform .15s, opacity .15s;
}
.convo-bar button:disabled { opacity: .4; cursor: default; }
.convo-bar button:not(:disabled):hover { background: var(--ember-deep); transform: translateY(-1px); }
.convo-bar button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

/* ---------- chats page ---------- */
.chats-layout { display: grid; grid-template-columns: 21rem 1fr; gap: 2rem; align-items: start; }
.chats-side { display: flex; flex-direction: column; gap: 1.1rem; }
.chats-bar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.chats-clear { background: none; border: 0; color: var(--down); font: 500 .84rem var(--sans); cursor: pointer; padding: .3rem .2rem; }
.chats-clear:hover { text-decoration: underline; }
.chats-clear:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.chats-none { color: var(--ink-3); font-size: .88rem; margin: 0; }
.chats-day {
  font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); margin: 0 0 .5rem;
}
.chats-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .45rem; }
.chats-list li { position: relative; }
.chat-item {
  display: flex; flex-direction: column; gap: .15rem; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: .7rem .9rem; cursor: pointer; font: inherit; color: inherit;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.chat-item:hover { border-color: var(--hairline-2); transform: translateY(-1px); box-shadow: var(--shadow-1); }
.chat-item.on { border-color: var(--ember); background: var(--ember-wash); }
.chat-item:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.ci-title { font-weight: 600; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 1.4rem; }
.ci-preview { color: var(--ink-2); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ci-meta { color: var(--ink-3); font-size: .72rem; font-variant-numeric: tabular-nums; }
.ci-del {
  position: absolute; top: .45rem; right: .45rem;
  background: none; border: 0; color: var(--ink-3); font-size: .95rem; line-height: 1;
  padding: .18rem .4rem; border-radius: 6px; cursor: pointer; opacity: 0; transition: opacity .15s, color .15s;
}
.chats-list li:hover .ci-del, .ci-del:focus-visible { opacity: 1; }
.ci-del:hover { color: var(--down); }
.ci-del:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }
.chats-main { min-width: 0; }
.chats-back { display: none; background: none; border: 0; color: var(--ember-deep); font: 500 .88rem var(--sans); cursor: pointer; padding: 0 0 .6rem; }
.page-convo {
  background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius);
  height: 34rem; display: flex; flex-direction: column; overflow: hidden;
}
.page-convo .convo { flex: 1; }

/* ---------- ask CTA on trend detail ---------- */
.ask-cta { display: inline-flex; align-items: center; gap: .45rem; }
.ask-cta-bot { color: var(--ember); }
.section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1.5rem; }

@media (max-width: 900px) {
  .chats-layout { grid-template-columns: 1fr; }
  .chats-back { display: inline-block; }
  .chats-layout:not(.has-open) .chats-main { display: none; }
  .chats-layout.has-open .chats-side { display: none; }
}
@media (max-width: 640px) {
  :root { --dock-b: 16px; --dock-r: 16px; }
  .assistant-fab { width: 56px; height: 56px; }
  .assistant-panel {
    right: var(--dock-r); left: var(--dock-r); width: auto;
    bottom: calc(var(--dock-b) + 64px); height: auto; top: calc(env(safe-area-inset-top, 0px) + 12px);
    max-height: none; border-radius: 12px;
  }
  .convo-bar textarea { min-height: 2.75rem; }  /* 44px touch target */
  .convo-bar button { width: 44px; height: 44px; }
  .page-convo { height: 30rem; }
}

/* ---------- layout ---------- */
main { min-height: 60vh; }
.section { max-width: 72rem; margin: 0 auto; padding: 3.75rem 1.5rem 1rem; }
.eyebrow {
  font-size: .72rem; font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ember); margin: 0 0 .55rem;
}
.section h2 {
  font-family: var(--serif); font-weight: 560; letter-spacing: -0.015em;
  font-size: clamp(1.55rem, 3vw, 2.1rem); margin: 0 0 .4rem;
}
.note { color: var(--ink-3); font-size: .95rem; margin: 0 0 1.75rem; max-width: 62ch; }
.note.small { margin: .5rem 0 0; font-size: .85rem; }
.sub { font-family: var(--serif); font-size: 1.12rem; font-weight: 560; margin: 1.9rem 0 .7rem; }

/* ---------- badges & deltas ---------- */
.badge {
  display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .06em;
  border-radius: 5px; padding: .18rem .5rem; white-space: nowrap;
}
.badge-cat { background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--hairline); }
.badge-ember { background: var(--ember-wash); color: var(--ember-deep); }
.delta { display: inline-flex; align-items: center; gap: .28rem; font-size: .84rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.delta-up { color: var(--up); }
.delta-down { color: var(--down); }
.delta-flat { color: var(--flat); font-weight: 500; }

/* ---------- filters ---------- */
.filters { display: flex; flex-direction: column; gap: .8rem; margin-bottom: 1.9rem; }
.search-field {
  position: relative; max-width: 26rem;
}
.search-field svg { position: absolute; left: .8rem; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search-field input {
  width: 100%; padding: .62rem 1rem .62rem 2.3rem;
  border: 1px solid var(--hairline-2); border-radius: 9px; background: var(--card);
  font: 400 .93rem var(--sans); color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
.search-field input:focus { outline: none; border-color: var(--ember); box-shadow: 0 0 0 3px var(--ember-wash); }
.sorts, .cats { display: flex; gap: .3rem; flex-wrap: wrap; }
.sorts button, .cats button {
  background: none; border: 1px solid transparent; border-radius: 999px;
  color: var(--ink-2); font: 500 .86rem var(--sans); padding: .34rem .78rem; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
}
.sorts button { border-color: var(--hairline-2); }
.sorts button:hover, .cats button:hover { color: var(--ink); border-color: var(--ink-3); }
.sorts button.on, .cats button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---------- trend cards ---------- */
.trend-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr));
  gap: 1.1rem;
}
.trend-card {
  background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  opacity: 0; animation: card-in .5s ease both; animation-delay: var(--stagger, 0ms);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
@keyframes card-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.trend-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: var(--hairline-2); }
.card-hit {
