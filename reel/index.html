<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #1d2540;
        --glow: #f4b183;
        --ink: #fff6ea;
        --cloud: #fff1e0;
        --font-display: "Playfair Display", serif;
        --font-body: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 100%, rgba(255, 190, 140, 0.35) 0%, rgba(255, 190, 140, 0) 55%),
          radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(10, 12, 30, 0.55) 100%),
          linear-gradient(180deg, #121832 0%, #2a2f5a 30%, #5a4a78 52%, #c9776f 78%, #f0a27a 100%);
        font-family: var(--font-display);
        color: var(--ink);
      }
      .cloud {
        position: absolute;
        width: 520px;
        height: 150px;
        opacity: 0.9;
      }
      .cloud { filter: blur(1.5px); }
      .cloud i {
        position: absolute;
        background: radial-gradient(ellipse at 50% 25%, #fffaf2 0%, var(--cloud) 55%, #e7b9a4 100%);
        border-radius: 50%;
        box-shadow: 0 14px 30px rgba(120, 60, 70, 0.25);
      }
      .cloud i:nth-child(1) { left: 0; top: 60px; width: 260px; height: 90px; }
      .cloud i:nth-child(2) { left: 90px; top: 10px; width: 200px; height: 140px; }
      .cloud i:nth-child(3) { left: 220px; top: 40px; width: 300px; height: 110px; }
      #stars {
        position: absolute;
        left: 0; top: 0; width: 1080px; height: 900px;
        background:
          radial-gradient(circle 2px at 120px 160px, #fff 98%, transparent) ,
          radial-gradient(circle 3px at 310px 90px, #fff 98%, transparent),
          radial-gradient(circle 2px at 520px 230px, #fff 98%, transparent),
          radial-gradient(circle 2px at 760px 130px, #fff 98%, transparent),
          radial-gradient(circle 3px at 930px 260px, #fff 98%, transparent),
          radial-gradient(circle 2px at 200px 330px, #fff 98%, transparent),
          radial-gradient(circle 2px at 880px 60px, #fff 98%, transparent),
          radial-gradient(circle 2px at 600px 70px, #fff 98%, transparent);
        opacity: 0.8;
      }
      #sun {
        position: absolute;
        left: 290px;
        top: 1180px;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff0d2 0%, #ffd7a8 28%, var(--glow) 52%, rgba(244,177,131,0) 72%);
      }
      #kettle {
        position: absolute;
        left: 390px;
        top: 1520px;
        width: 300px;
        height: 250px;
      }
      #kettle .body { position: absolute; left: 20px; top: 70px; width: 220px; height: 170px; border-radius: 90px 90px 30px 30px; background: linear-gradient(100deg, #2b3157 0%, #10152b 38%, #0a0e20 100%); box-shadow: inset 8px 8px 0 -4px rgba(255, 215, 168, 0.35); }
      #kettle .gloss { position: absolute; left: 52px; top: 100px; width: 22px; height: 80px; border-radius: 12px; background: linear-gradient(180deg, rgba(255,235,210,0.55), rgba(255,235,210,0)); }
      #kettle .ground { position: absolute; left: -10px; top: 232px; width: 270px; height: 26px; border-radius: 50%; background: rgba(60, 20, 40, 0.45); filter: blur(8px); }
      #kettle .spout { position: absolute; left: 215px; top: 100px; width: 80px; height: 22px; border-radius: 12px; background: #10152b; transform-origin: left center; transform: rotate(-28deg); }
      #kettle .lid { position: absolute; left: 95px; top: 48px; width: 70px; height: 28px; border-radius: 20px; background: #10152b; }
      #kettle .handle { position: absolute; left: -10px; top: 90px; width: 70px; height: 110px; border: 16px solid #10152b; border-right: none; border-radius: 60px 0 0 60px; }
      .steam {
        position: absolute;
        left: 520px;
        top: 1440px;
        width: 24px;
        height: 150px;
        border-radius: 20px;
        filter: blur(7px);
        background: linear-gradient(180deg, rgba(255,246,234,0), rgba(255,246,234,0.8));
      }
      .line {
        position: absolute;
        left: 120px;
        width: 768px;
        text-align: center;
        font-size: 150px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.02em;
        text-shadow: 0 6px 40px rgba(16, 21, 43, 0.45);
      }
      #l1 { top: 420px; }
      #l2 { top: 420px; }
      #l3 { top: 420px; }
      #brand {
        position: absolute;
        left: 120px;
        width: 768px;
        top: 800px;
        text-align: center;
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 36px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div id="stars" class="clip" data-start="0" data-duration="5" data-track-index="0" data-layout-ignore></div>
      <div id="sun" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>

      <div id="cloudA" class="cloud clip" data-start="0" data-duration="5" data-track-index="0" style="left: -300px; top: 1000px;"><i></i><i></i><i></i></div>
      <div id="cloudB" class="cloud clip" data-start="0" data-duration="5" data-track-index="0" style="left: 700px; top: 1180px; transform: scale(0.7);"><i></i><i></i><i></i></div>

      <div id="kettle" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="ground"></div><div class="handle"></div><div class="body"></div><div class="gloss"></div><div class="spout"></div><div class="lid"></div>
      </div>
      <div id="steam1" class="steam clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <div id="steam2" class="steam clip" data-start="0" data-duration="5" data-track-index="0" style="left: 570px; top: 1460px; height: 110px;"></div>

      <h1 id="l1" class="line clip" data-start="0" data-duration="1.3" data-track-index="1">Kettle on.</h1>
      <h1 id="l2" class="line clip" data-start="1.3" data-duration="1.3" data-track-index="1">Clouds rolling in.</h1>
      <h1 id="l3" class="line clip" data-start="2.6" data-duration="2.4" data-track-index="1">Slow mornings.</h1>
      <audio id="sfx1" src="assets/sfx/whoosh-short.mp3" data-start="1.22" data-duration="0.57" data-track-index="2" data-volume="1"></audio>
      <audio id="sfx2" src="assets/sfx/whoosh.mp3" data-start="2.52" data-duration="0.57" data-track-index="2" data-volume="1"></audio>
      <audio id="sfx3" src="assets/sfx/sparkle.mp3" data-start="3.1" data-duration="1.8" data-track-index="3" data-volume="0.75"></audio>
      <p id="brand" class="clip" data-start="2.9" data-duration="2.1" data-track-index="1">Kettle &amp; Cloud</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Backdrop motion across the full 5 s
      tl.fromTo("#sun", { y: 120, scale: 0.85 }, { y: -220, scale: 1.15, duration: 4.9, ease: "sine.inOut" }, 0);
      tl.fromTo("#cloudA", { x: 0 }, { x: 900, duration: 4.9, ease: "none" }, 0);
      tl.fromTo("#cloudB", { x: 0 }, { x: -820, duration: 4.9, ease: "none" }, 0);
      tl.fromTo("#kettle", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#steam1", { y: 0, opacity: 0.9, scaleY: 0.5 }, { y: -120, opacity: 0, scaleY: 1.2, duration: 1.2, ease: "power1.out" }, 0.2);
      tl.fromTo("#steam2", { y: 0, opacity: 0.9, scaleY: 0.5 }, { y: -120, opacity: 0, scaleY: 1.2, duration: 1.2, ease: "power1.out" }, 0.6);
      tl.fromTo("#steam1", { y: 0, opacity: 0.9, scaleY: 0.5 }, { y: -120, opacity: 0, scaleY: 1.2, duration: 1.2, ease: "power1.out" , immediateRender: false}, 1.8);
      tl.fromTo("#steam2", { y: 0, opacity: 0.9, scaleY: 0.5 }, { y: -120, opacity: 0, scaleY: 1.2, duration: 1.2, ease: "power1.out" , immediateRender: false}, 2.4);
      tl.fromTo("#steam1", { y: 0, opacity: 0.9, scaleY: 0.5 }, { y: -120, opacity: 0, scaleY: 1.2, duration: 1.2, ease: "power1.out" , immediateRender: false}, 3.3);
      tl.fromTo("#steam2", { y: 0, opacity: 0.9, scaleY: 0.5 }, { y: -120, opacity: 0, scaleY: 1.2, duration: 1.2, ease: "power1.out" , immediateRender: false}, 3.7);

      // Text beats: each lands, holds, leaves just before its slot ends
      // Text beats: each lands, holds, leaves just before its slot ends; the last holds to the end
      tl.fromTo("#l1", { y: 40 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0);
      tl.to("#l1", { opacity: 0, y: -30, duration: 0.2, ease: "power2.in" }, 1.05);
      tl.fromTo("#l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.3);
      tl.to("#l2", { opacity: 0, y: -30, duration: 0.2, ease: "power2.in" }, 2.35);
      tl.fromTo("#l3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.6);
      tl.fromTo("#brand", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.9);

      tl.fromTo("#stars", { opacity: 0.5 }, { opacity: 1, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
